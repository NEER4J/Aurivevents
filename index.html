<script>/* theme before first paint: system · light · dark, kept on this device */
(function(){try{var t=localStorage.getItem('auriv.theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}})();</script>

<body class="no-shell">
<!-- One app at every width. Phone and tablet: app bar, page, floating dock. Desktop (1100+): side menu instead of the dock.
     Detail sheets open from below on a phone and as a drawer from the right on wider screens. -->
<div class="shell">
  <aside class="side"><div class="brand">Aurivevents<small>KNOW YOUR MARGIN</small></div><nav class="nav" id="nav"></nav><div class="foot" id="sidefoot"></div></aside>
  <main class="main">
    <header class="appbar" id="appbar">
      <a class="ab-word" href="#home">Aurivevents</a>
      <span class="ab-space"></span>
      <a class="ab-btn" href="#inbox" id="ab-inbox" aria-label="Inbox"><svg viewBox="0 0 24 24"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg><i class="ab-dot" hidden></i></a>
      <button class="ab-avatar" type="button" id="ab-avatar" aria-label="Account and menu"></button>
    </header>
    <div class="wrap" id="app"><div class="boot"><div class="boot-word">Aurivevents</div></div></div>
  </main>
</div>
<nav class="dock" id="dock" aria-label="Main"><span class="dock-ind" id="dock-ind"></span><div class="dock-tabs" id="dockbar"></div></nav>

<div id="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script>
<script src="js/cloud.js"></script>
<script>
/* PWA: offline cache + install prompt */
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(e => console.warn('sw', e)));
}
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); window.__installPrompt = e; document.documentElement.classList.add('can-install') });
window.addEventListener('appinstalled', () => { window.__installPrompt = null; document.documentElement.classList.remove('can-install') });
if (matchMedia('(display-mode: standalone)').matches || navigator.standalone) document.documentElement.classList.add('standalone');
</script>
</body>
